<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <link rel="stylesheet" href="logs.css" />
    <link rel="stylesheet" href="icons.css" />
    <link rel="stylesheet" href="emoji.css" />
    <title>Logs</title>
  </head>
  <body>
    <!--
      The titlebar is `hiddenInset`, so macOS paints no title of its own and
      this strip was 36px of dead space. It now carries the window title, which
      frees the header row below for controls. On Windows/Linux the native
      titlebar already shows the title, so CSS hides the strip there
      (html[data-os] — see logs.css).
    -->
    <div class="app-window-spacer">
      <strong id="title">Logs</strong>
      <span id="uptime-badge" class="uptime-badge"></span>
    </div>
    <div class="shell">
      <aside id="sidebar">
        <div class="side-head">
          <input
            id="side-filter"
            type="search"
            placeholder="Buscar servicio…"
          />
        </div>
        <div id="side-tree"></div>
      </aside>
      <div class="pane">
        <header>
          <button
            id="toggle-sidebar"
            class="icon-btn"
            type="button"
            title="Ocultar / mostrar el panel lateral"
            aria-label="Ocultar / mostrar el panel lateral"
          >
            <span class="icon" data-icon="panel-left"></span>
          </button>
          <button
            id="run-toggle"
            class="run-btn"
            type="button"
            title="Arrancar / parar"
            aria-label="Arrancar / parar"
          >
            <span class="icon" data-icon="play"></span>
          </button>
          <input
            id="filter"
            type="search"
            placeholder="Filtrar (texto o regex)…"
          />
          <!--
            The level filter is driven from the nav (per service, per group) and
            from the tray. This pill is only its escape hatch: it appears when a
            filter is active and clicking it clears it.
          -->
          <button id="level-pill" class="level-pill" type="button" hidden>
            <span id="level-pill-text"></span>
            <span class="level-pill-x"
              ><span class="icon" data-icon="x"></span
            ></span>
          </button>
          <label class="check spaced"
            ><input type="checkbox" id="autoscroll" checked />
            Auto-scroll</label
          >
          <label class="check"
            ><input type="checkbox" id="paused" /> Pausa</label
          >
          <button
            id="clear"
            class="icon-btn"
            title="Limpiar"
            aria-label="Limpiar"
          >
            <span class="icon" data-icon="trash-2"></span>
          </button>
          <button id="copy" class="icon-btn" title="Copiar" aria-label="Copiar">
            <span class="icon" data-icon="copy"></span>
          </button>
          <button
            id="toggle-silenced"
            class="silence-toggle"
            type="button"
            title="Silenciados"
            aria-label="Silenciados"
            aria-haspopup="dialog"
            aria-controls="silence-popover"
            aria-expanded="false"
          >
            <span class="icon" data-icon="bell-off"></span>
            <span id="silence-toggle-count" class="silence-toggle-count"></span>
          </button>
          <button
            id="detach"
            class="icon-btn"
            title="Abrir este log en una ventana aparte"
            aria-label="Abrir en ventana aparte"
          >
            <span class="icon" data-icon="app-window"></span>
          </button>
        </header>
        <div class="log-container">
          <main>
            <div id="lines"></div>
          </main>
          <button
            id="scroll-bottom"
            class="scroll-bottom-btn"
            type="button"
            aria-label="Ir al final"
          >
            <span class="icon" data-icon="arrow-down"></span>
          </button>
          <!--
            Silenced popover. Floats over the log, under its toolbar toggle, so
            the rules and the lines they swallow are visible together: the
            draft previews, live, which held lines it would silence, and
            hovering a saved rule marks what it is eating.
          -->
          <div
            id="silence-popover"
            class="silence-popover"
            role="dialog"
            aria-label="Silenciados"
            hidden
          >
            <div id="silence-composer" class="sil-composer">
              <span class="icon sil-composer-icon" data-icon="bell-off"></span>
              <input
                id="silence-input"
                class="sil-input"
                type="text"
                placeholder="Silenciar líneas que contengan…"
                aria-label="Silenciar líneas que contengan"
                spellcheck="false"
                autocomplete="off"
              />
              <span id="silence-count" class="sil-count" hidden></span>
              <button
                id="silence-regex"
                class="sil-regex"
                type="button"
                aria-pressed="false"
                title="Usar como regex"
              >
                .*
              </button>
            </div>
            <div id="silence-error" class="sil-error" hidden></div>
            <div class="sil-row">
              <span class="sil-en">en</span>
              <button
                id="silence-level-warn"
                class="sil-pill"
                type="button"
                data-level="warn"
                aria-pressed="true"
              >
                <span class="sil-dot"></span>warnings
              </button>
              <button
                id="silence-level-error"
                class="sil-pill"
                type="button"
                data-level="error"
                aria-pressed="false"
              >
                <span class="sil-dot"></span>errores
              </button>
              <span class="sil-grow"></span>
              <button
                id="silence-submit"
                class="sil-submit"
                type="button"
                disabled
              >
                Silenciar
              </button>
            </div>
            <div class="sil-sep"></div>
            <ul id="silence-rules" class="sil-rules"></ul>
            <div class="sil-switches">
              <label class="sil-switch">
                <input
                  id="mute-warn"
                  class="switch"
                  type="checkbox"
                  role="switch"
                />
                Todos los warnings
              </label>
              <label class="sil-switch">
                <input
                  id="mute-err"
                  class="switch"
                  type="checkbox"
                  role="switch"
                />
                Todos los errores
              </label>
            </div>
          </div>
        </div>
        <footer>
          <span class="footer-left">
            <span id="counts">0 líneas</span>
            <span id="silence-preview" class="silence-preview" hidden>
              <span class="silence-preview-swatch"></span>
              <span id="silence-preview-text"></span>
            </span>
          </span>
          <span class="footer-status">
            <span id="status"></span>
            <button
              id="clear-selection"
              class="clear-selection-btn"
              type="button"
              title="Quitar selección (Esc)"
              aria-label="Quitar selección"
              hidden
            >
              <span class="icon" data-icon="x"></span>
            </button>
          </span>
        </footer>
      </div>
    </div>
    <script type="module" src="logs.js"></script>
  </body>
</html>
