<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <link rel="stylesheet" href="logs.css" />
    <link rel="stylesheet" href="icons.css" />
    <link rel="stylesheet" href="emoji.css" />
    <title>Logs</title>
  </head>
  <body>
    <div class="shell">
      <aside id="sidebar">
        <div class="side-head">
          <label class="side-search">
            <span class="icon side-search-ico" data-icon="search"></span>
            <input
              id="side-filter"
              type="search"
              placeholder="Buscar servicio"
              aria-label="Buscar servicio"
              aria-keyshortcuts="Meta+K Control+K"
            />
            <kbd id="side-filter-key" class="side-kbd">Ctrl+K</kbd>
          </label>
        </div>
        <div id="side-tree"></div>
      </aside>
      <div class="pane">
        <!--
          The titlebar is `hiddenInset`: on macOS the traffic lights sit over
          the top of the sidebar (or over this toolbar's left edge when there
          is no sidebar), so the toolbar doubles as the window's drag strip.
          It reads left to right as what is on screen, how it is doing, and
          what you can do to it — then how you look at it.
        -->
        <header class="toolbar">
          <button
            id="toggle-sidebar"
            class="icon-btn"
            type="button"
            title="Ocultar / mostrar el panel lateral"
            aria-label="Ocultar / mostrar el panel lateral"
          >
            <span class="icon" data-icon="panel-left"></span>
          </button>
          <div class="tb-subject">
            <span class="crumbs">
              <span id="crumb-group" class="crumb-group" hidden></span>
              <span id="crumb-sep" class="crumb-sep" hidden
                ><span class="icon" data-icon="chevron-right"></span
              ></span>
              <strong id="crumb-name" class="crumb-name">Logs</strong>
            </span>
            <span id="run-pill" class="run-pill" hidden>
              <span class="run-pill-dot"></span>
              <span id="run-pill-text"></span>
            </span>
            <span id="port-pill" class="port-pill" hidden></span>
          </div>
          <span class="tb-grow"></span>
          <!--
            Right: icon-only actions, each named by its tooltip. A narrow
            window folds Reiniciar, Parar and Silenciados into the «⋯» menu
            (see «Logs: header» in logs.css and menu.ts).
          -->
          <button
            id="restart"
            class="icon-btn tb-ico tb-wide"
            type="button"
            title="Reiniciar"
            aria-label="Reiniciar"
            hidden
          >
            <span class="icon" data-icon="rotate-cw"></span>
          </button>
          <button
            id="run-toggle"
            class="icon-btn tb-ico run-btn tb-wide"
            type="button"
            title="Iniciar"
            aria-label="Iniciar"
            hidden
          >
            <span class="icon" data-icon="play"></span>
          </button>
          <span class="tb-sep tb-wide" aria-hidden="true"></span>
          <button
            id="find-toggle"
            class="icon-btn tb-ico"
            type="button"
            title="Buscar (Ctrl+F)"
            aria-label="Buscar (Ctrl+F)"
            aria-keyshortcuts="Control+F"
            aria-pressed="false"
          >
            <span class="icon" data-icon="search"></span>
          </button>
          <button
            id="toggle-silenced"
            class="icon-btn tb-ico silence-toggle tb-wide"
            type="button"
            title="Silenciados"
            aria-label="Silenciados"
            aria-haspopup="dialog"
            aria-controls="silence-popover"
            aria-expanded="false"
          >
            <span class="icon" data-icon="bell-off"></span>
            <span
              id="silence-toggle-count"
              class="silence-toggle-count"
              aria-hidden="true"
            ></span>
          </button>
          <button
            id="live"
            class="live-btn"
            type="button"
            aria-pressed="true"
            aria-label="En directo"
          >
            <span class="live-dot"></span>
            <span id="live-text">En directo</span>
          </button>
          <span class="tb-more">
            <button
              id="more"
              class="icon-btn tb-ico"
              type="button"
              title="Más opciones"
              aria-label="Más opciones"
              aria-haspopup="menu"
              aria-expanded="false"
            >
              <span class="icon" data-icon="ellipsis"></span>
            </button>
          </span>
        </header>
        <!--
          Activity strip: one bar per slice of time for the lines on screen.
          Hidden until the scope spans at least two slices, or when switched
          off from the «⋯» menu. Bars are buttons that jump to their lines.
        -->
        <div id="activity" class="activity" role="group" hidden>
          <div id="activity-bars" class="activity-bars"></div>
          <span
            id="activity-span"
            class="activity-span"
            aria-hidden="true"
          ></span>
        </div>
        <div class="log-container">
          <main tabindex="-1">
            <div id="lines"></div>
          </main>
          <!--
            «Buscar en el log» (Cmd/Ctrl+F): floats over the top-right of the
            log, so the hits and the lines around them stay in view. The
            level chips live here too: text and level both narrow the same
            lines. «Solo coincidencias» hides what does not match; without it
            every line stays and the hits are marked.
          -->
          <div
            id="find"
            class="find"
            role="search"
            aria-label="Buscar en el log"
            hidden
          >
            <div id="find-field" class="find-field">
              <span class="icon find-ico" data-icon="search"></span>
              <input
                id="find-input"
                class="find-input"
                type="text"
                placeholder="Buscar en el log"
                aria-label="Texto a buscar"
                spellcheck="false"
                autocomplete="off"
              />
              <button
                id="find-case"
                class="find-tog"
                type="button"
                aria-pressed="false"
                title="Distinguir mayúsculas"
              >
                Aa
              </button>
              <button
                id="find-word"
                class="find-tog find-word"
                type="button"
                aria-pressed="false"
                title="Palabra completa"
              >
                ab
              </button>
              <button
                id="find-regex"
                class="find-tog"
                type="button"
                aria-pressed="false"
                title="Expresión regular"
              >
                .*
              </button>
            </div>
            <div class="find-bar">
              <span class="level-chips" role="group" aria-label="Nivel">
                <button
                  id="level-all"
                  class="level-chip"
                  type="button"
                  aria-pressed="true"
                  title="Todos los niveles"
                >
                  Todo
                </button>
                <button
                  id="level-warn"
                  class="level-chip warn"
                  type="button"
                  aria-pressed="false"
                  title="Sólo warnings"
                >
                  <span class="level-chip-dot"></span
                  ><span id="level-warn-count">0</span>
                </button>
                <button
                  id="level-error"
                  class="level-chip err"
                  type="button"
                  aria-pressed="false"
                  title="Sólo errores"
                >
                  <span class="level-chip-dot"></span
                  ><span id="level-error-count">0</span>
                </button>
              </span>
              <span class="find-sep"></span>
              <button
                id="find-only"
                class="level-chip find-only"
                type="button"
                aria-pressed="false"
                title="Mostrar solo las líneas que coinciden"
              >
                <span class="icon" data-icon="funnel"></span>Solo coincidencias
              </button>
              <span class="find-grow"></span>
              <span
                id="find-count"
                class="find-count"
                aria-live="polite"
              ></span>
              <button
                id="find-prev"
                class="find-nav"
                type="button"
                title="Anterior (Shift+Enter)"
                aria-label="Anterior (Shift+Enter)"
              >
                <span class="icon" data-icon="chevron-up"></span>
              </button>
              <button
                id="find-next"
                class="find-nav"
                type="button"
                title="Siguiente (Enter)"
                aria-label="Siguiente (Enter)"
              >
                <span class="icon" data-icon="chevron-down"></span>
              </button>
              <button
                id="find-close"
                class="find-nav"
                type="button"
                title="Cerrar (Esc)"
                aria-label="Cerrar (Esc)"
              >
                <span class="icon" data-icon="x"></span>
              </button>
            </div>
          </div>
          <!-- Where the hits are in the whole log; a tick jumps to its line. -->
          <div id="find-ticks" class="find-ticks" hidden></div>
          <button
            id="scroll-bottom"
            class="scroll-bottom-btn"
            type="button"
            aria-label="Ir al final"
          >
            <span class="icon" data-icon="arrow-down"></span>
          </button>
          <!--
            Silenced popover. Floats over the log, under its toolbar toggle, so
            the rules and the lines they swallow are visible together: the
            draft previews, live, which held lines it would silence, and
            hovering a saved rule marks what it is eating.
          -->
          <div
            id="silence-popover"
            class="silence-popover"
            role="dialog"
            aria-label="Silenciados"
            hidden
          >
            <div id="silence-composer" class="sil-composer">
              <span class="icon sil-composer-icon" data-icon="bell-off"></span>
              <input
                id="silence-input"
                class="sil-input"
                type="text"
                placeholder="Silenciar líneas que contengan…"
                aria-label="Silenciar líneas que contengan"
                spellcheck="false"
                autocomplete="off"
              />
              <span id="silence-count" class="sil-count" hidden></span>
              <button
                id="silence-regex"
                class="sil-regex"
                type="button"
                aria-pressed="false"
                title="Usar como regex"
              >
                .*
              </button>
            </div>
            <div id="silence-error" class="sil-error" hidden></div>
            <div class="sil-row">
              <span class="sil-en">en</span>
              <button
                id="silence-level-warn"
                class="sil-pill"
                type="button"
                data-level="warn"
                aria-pressed="true"
              >
                <span class="sil-dot"></span>warnings
              </button>
              <button
                id="silence-level-error"
                class="sil-pill"
                type="button"
                data-level="error"
                aria-pressed="false"
              >
                <span class="sil-dot"></span>errores
              </button>
              <span class="sil-grow"></span>
              <button
                id="silence-submit"
                class="sil-submit"
                type="button"
                disabled
              >
                Silenciar
              </button>
            </div>
            <div class="sil-sep"></div>
            <ul id="silence-rules" class="sil-rules"></ul>
            <div class="sil-switches">
              <label class="sil-switch">
                <input
                  id="mute-warn"
                  class="switch"
                  type="checkbox"
                  role="switch"
                />
                Todos los warnings
              </label>
              <label class="sil-switch">
                <input
                  id="mute-err"
                  class="switch"
                  type="checkbox"
                  role="switch"
                />
                Todos los errores
              </label>
            </div>
          </div>
        </div>
        <footer>
          <span class="footer-left">
            <span id="counts">0 líneas</span>
            <span id="silence-preview" class="silence-preview" hidden>
              <span class="silence-preview-swatch"></span>
              <span id="silence-preview-text"></span>
            </span>
          </span>
          <span class="footer-right">
            <span class="footer-status">
              <span id="status"></span>
              <button
                id="clear-selection"
                class="clear-selection-btn"
                type="button"
                title="Quitar selección (Esc)"
                aria-label="Quitar selección"
                hidden
              >
                <span class="icon" data-icon="x"></span>
              </button>
            </span>
            <label class="footer-switch">
              Ajustar líneas
              <input
                id="wrap-lines"
                class="switch"
                type="checkbox"
                role="switch"
                checked
              />
            </label>
            <button
              id="time-mode"
              class="footer-toggle"
              type="button"
              aria-pressed="false"
              title="Cambiar entre hora absoluta y relativa"
            >
              Hora <span id="time-mode-value">absoluta</span>
            </button>
          </span>
        </footer>
      </div>
    </div>
    <script type="module" src="logs.js"></script>
  </body>
</html>
