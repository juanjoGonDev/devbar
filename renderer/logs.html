<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <link rel="stylesheet" href="logs.css" />
    <title>Logs</title>
  </head>
  <body>
    <div class="app-window-spacer"></div>
    <div class="shell">
      <aside id="sidebar">
        <div class="side-head">
          <input
            id="side-filter"
            type="search"
            placeholder="Buscar servicio…"
          />
        </div>
        <div id="side-tree"></div>
      </aside>
      <div class="pane">
        <header>
          <button
            id="run-toggle"
            class="run-btn"
            type="button"
            title="Arrancar / parar"
          >
            ▶
          </button>
          <strong id="title">Logs</strong>
          <span id="uptime-badge" class="uptime-badge"></span>
          <input
            id="filter"
            type="search"
            placeholder="Filtrar (texto o regex)…"
          />
          <label class="check"
            ><input type="checkbox" id="autoscroll" checked />
            Auto-scroll</label
          >
          <label class="check"
            ><input type="checkbox" id="paused" /> Pausa</label
          >
          <label
            class="check"
            title="Silencia todos los warnings detectados en este servicio (no afecta al color)"
            ><input type="checkbox" id="mute-warn" /> warns</label
          >
          <label
            class="check"
            title="Silencia todos los errors detectados en este servicio (no afecta al color)"
            ><input type="checkbox" id="mute-err" /> errors</label
          >
          <button
            id="clear"
            class="icon-btn"
            title="Limpiar"
            aria-label="Limpiar"
          >
            🗑
          </button>
          <button id="copy" class="icon-btn" title="Copiar" aria-label="Copiar">
            📋
          </button>
          <button
            id="toggle-silenced"
            class="icon-btn"
            title="Patrones silenciados"
            aria-label="Patrones silenciados"
          >
            🔕
          </button>
          <button
            id="detach"
            class="icon-btn"
            title="Abrir este log en una ventana aparte"
            aria-label="Abrir en ventana aparte"
          >
            ⧉
          </button>
        </header>
        <div class="log-container">
          <main>
            <div id="lines"></div>
          </main>
          <button
            id="scroll-bottom"
            class="scroll-bottom-btn"
            type="button"
            aria-label="Ir al final"
          >
            ↓
          </button>
        </div>
        <footer>
          <span id="counts">0 líneas</span>
          <span id="status"></span>
        </footer>
      </div>
    </div>
    <script type="module" src="logs.js"></script>
  </body>
</html>
