<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="icons.css" />
    <link rel="stylesheet" href="emoji.css" />
    <title>DevBar</title>
  </head>
  <body class="tray">
    <div class="tray-header sticky">
      <div class="tray-header-row">
        <h1>DevBar</h1>
        <button
          id="app-version"
          class="app-version"
          type="button"
          title="Ver changelog"
        ></button>
        <span id="alerts-summary" class="alerts-summary"></span>
        <span class="spacer"></span>
        <!-- Only while the user has pinned the popover away from the icon. -->
        <button
          id="reset-tray-position"
          class="ghost icon-only"
          type="button"
          title="Restablecer posición"
          aria-label="Restablecer posición"
          hidden
        >
          <span class="icon" data-icon="locate-fixed"></span>
        </button>
        <button
          id="open-telemetry"
          class="ghost icon-only"
          title="Telemetría — todos los logs de todos los grupos"
          aria-label="Telemetría"
        >
          <span class="icon" data-icon="scroll-text"></span>
        </button>
        <button
          id="open-config"
          class="ghost icon-only"
          title="Configuración"
          aria-label="Configuración"
        >
          <span class="icon" data-icon="settings"></span>
        </button>
        <button
          id="quit-app"
          class="ghost danger icon-only"
          title="Salir"
          aria-label="Salir"
        >
          <span class="icon" data-icon="power"></span>
        </button>
      </div>
      <!-- Slim status strip under the header row; the area collapses when
           it is not showing (renderer/tray/strip.ts). -->
      <div id="tray-strips" class="tray-strips" hidden>
        <div id="update-strip" class="tray-strip" hidden></div>
      </div>
    </div>
    <!-- «Grupos | Workflows»: hidden while there is no workflow to list
         (renderer/tray/tabs.ts). -->
    <div
      id="tray-tabs"
      class="tray-tabs"
      role="tablist"
      aria-label="Contenido del panel"
      hidden
    >
      <button
        id="tray-tab-groups"
        class="tray-tab"
        type="button"
        role="tab"
        aria-selected="true"
        aria-controls="groups"
      >
        Grupos <span class="tray-tab-count"></span>
      </button>
      <button
        id="tray-tab-workflows"
        class="tray-tab"
        type="button"
        role="tab"
        aria-selected="false"
        aria-controls="groups"
        tabindex="-1"
      >
        Workflows <span class="tray-tab-badge" hidden></span>
      </button>
    </div>
    <div id="groups" class="groups-list"></div>
    <div id="toast" style="display: none" class="toast"></div>
    <script type="module" src="tray.js"></script>
  </body>
</html>
