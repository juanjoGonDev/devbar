<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>DevBar</title>
  </head>
  <body class="tray">
    <div class="tray-header sticky">
      <div class="tray-header-row">
        <h1>DevBar</h1>
        <button
          id="app-version"
          class="app-version"
          type="button"
          title="Ver changelog"
        ></button>
        <span id="alerts-summary" class="alerts-summary"></span>
        <span class="spacer"></span>
        <button
          id="open-config"
          class="ghost icon-only"
          title="Configuración"
          aria-label="Configuración"
        >
          ⚙️
        </button>
        <button
          id="quit-app"
          class="ghost danger icon-only"
          title="Salir"
          aria-label="Salir"
        >
          ⏻
        </button>
      </div>
    </div>
    <div id="groups" class="groups-list"></div>
    <div id="toast" style="display: none" class="toast"></div>
    <script src="format-uptime.js"></script>
    <script src="combobox.js"></script>
    <script src="md-mini.js"></script>
    <script src="modal.js"></script>
    <script src="changelog-view.js"></script>
    <script src="changelog.js"></script>
    <script src="tray.js"></script>
  </body>
</html>
