<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        cursor: default;
        -webkit-user-select: none;
        user-select: none;
      }
      #banner {
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 8px;
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(30, 30, 30, 0.98);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
        color: #f2f2f2;
      }
      #progress {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 3px;
        width: 100%;
        background: #4a9eff;
        transform-origin: left center;
      }
      @keyframes devbar-shrink {
        from {
          transform: scaleX(1);
        }
        to {
          transform: scaleX(0);
        }
      }
      #logo {
        width: 30px;
        height: 30px;
        border-radius: 7px;
        flex-shrink: 0;
      }
      .text {
        min-width: 0;
        flex: 1;
      }
      #title {
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 2px;
      }
      #body {
        font-size: 12px;
        color: #b9b9b9;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #close {
        flex-shrink: 0;
        border: none;
        background: transparent;
        color: #8a8a8a;
        font-size: 14px;
        cursor: pointer;
        padding: 2px 4px;
        border-radius: 6px;
      }
      #close:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="banner">
      <img id="logo" alt="" />
      <div class="text">
        <div id="title"></div>
        <div id="body"></div>
      </div>
      <button id="close" title="Cerrar">✕</button>
      <div id="progress"></div>
    </div>
    <script src="notification.js"></script>
  </body>
</html>
