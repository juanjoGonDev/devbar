# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  path_filters:
    # Authored JavaScript-family files are forbidden by CI after this migration.
    # Excluding their legacy deletions keeps reviews focused on the TypeScript replacements.
    - "!**/*.js"
    - "!**/*.jsx"
    - "!**/*.mjs"
    - "!**/*.cjs"
