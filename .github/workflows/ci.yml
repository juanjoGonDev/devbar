name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  export-migration:
    name: Export final TypeScript migration parts
    if: >-
      github.repository == 'juanjoGonDev/devbar' &&
      github.event_name == 'pull_request' &&
      github.head_ref == 'refactor/typescript-migration' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Upload raw migration parts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typescript-migration-parts-${{ github.event.pull_request.head.sha }}
          path: .migration-final/part-*
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
