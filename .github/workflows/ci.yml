name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  inspect-migration:
    name: Inspect final TypeScript migration archive
    if: >-
      github.repository == 'juanjoGonDev/devbar' &&
      github.event_name == 'pull_request' &&
      github.head_ref == 'refactor/typescript-migration' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Decode migration archive
        shell: bash
        run: |
          set -euo pipefail
          cat .migration-final/part-* | tr -d '\r\n ' > /tmp/migration-final.b64
          base64 --decode /tmp/migration-final.b64 > /tmp/migration-final.xz
          xz -t /tmp/migration-final.xz
          xz -dc /tmp/migration-final.xz > /tmp/migration-final.tar
          tar -tf /tmp/migration-final.tar

      - name: Upload decoded migration archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typescript-migration-final-${{ github.event.pull_request.head.sha }}
          path: /tmp/migration-final.tar
          retention-days: 1
          if-no-files-found: error
