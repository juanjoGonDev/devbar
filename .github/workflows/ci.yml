name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    name: Generate TypeScript migration lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.repository == 'juanjoGonDev/devbar' &&
      github.event_name == 'pull_request' &&
      github.head_ref == 'refactor/typescript-migration' &&
      github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Stage final dependency metadata
        env:
          PACKAGE_B64: 
          NPMRC_B64: 
        run: |
          printf '%s' "$PACKAGE_B64" | base64 --decode > package.json
          printf '%s' "$NPMRC_B64" | base64 --decode > .npmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Verify resolved metadata
        run: pnpm install --lockfile-only --frozen-lockfile --ignore-scripts

      - name: Upload lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typescript-migration-lock-${{ github.event.pull_request.head.sha }}
          path: pnpm-lock.yaml
          retention-days: 1
          if-no-files-found: error
