name: Agent format automation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: agent-format-automation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.head.ref == 'agent/fix-automation-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format automation files
        run: >-
          pnpm exec prettier --write
          .github/workflows/auto-merge-required-qa.workflow.yml
          .github/workflows/delete-cache.workflow.yml

      - name: Upload formatted files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formatted-automation-${{ github.sha }}
          path: |
            .github/workflows/auto-merge-required-qa.workflow.yml
            .github/workflows/delete-cache.workflow.yml
          if-no-files-found: error
          retention-days: 1
