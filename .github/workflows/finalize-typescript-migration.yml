name: Finalize strict TypeScript migration

on:
  push:
    branches:
      - refactor/typescript-migration

permissions:
  contents: write

concurrency:
  group: finalize-strict-typescript-migration
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Reconstruct verified migration patch
        shell: bash
        run: |
          set -euo pipefail
          cat .transport/*.hex | tr -d '\n' | xxd -r -p > /tmp/typescript-migration.patch.xz
          xz -t /tmp/typescript-migration.patch.xz
          xz -dc /tmp/typescript-migration.patch.xz > /tmp/typescript-migration.patch

      - name: Apply exact local migration
        shell: bash
        run: |
          set -euo pipefail
          mv renderer/config.js renderer/config.ts
          mv renderer/tray.js renderer/tray.ts
          mv src/icon-battery.js src/icon-battery.ts
          mv src/main.js src/main.ts
          mv tests/groups-model.test.js tests/groups-model.test.ts
          mv tests/pre-script-runner.test.js tests/pre-script-runner.test.ts
          git apply --check /tmp/typescript-migration.patch
          git apply /tmp/typescript-migration.patch
          rm -rf .transport
          rm -f transport-marker.txt
          git add -A
          test -z "$(git ls-files '*.js' '*.jsx' '*.mjs' '*.cjs')"
          git diff --cached --check
          test "$(git hash-object pnpm-lock.yaml)" = "2eeee073476eba2c3b8469d9930a1b2972d06174"
          test "$(git hash-object renderer/config.ts)" = "02028922deef7c06498ca7aa2ee9a2496d76c5cd"
          test "$(git hash-object renderer/tray.ts)" = "48393780c5e55c7e38da015669bf24c4ca1a083e"
          test "$(git hash-object renderer/styles.css)" = "84d72a3677734ad939421e7804a25eaa20a5a418"
          test "$(git hash-object src/icon-battery.ts)" = "fac28bce4f8ebc11cb6884ac5f390862c799a852"
          test "$(git hash-object src/main.ts)" = "8178ff516912a944a5103859c498d89633b41f20"
          test "$(git hash-object tests/groups-model.test.ts)" = "846b13924ec26c1189652ea18923b5b80e0fe1a4"
          test "$(git hash-object tests/pre-script-runner.test.ts)" = "414e9ed5e03e24efe86918339d44f05e1f605dce"

      - name: Commit finalized migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(typescript): finalize strict TypeScript migration'
          git push origin HEAD:refactor/typescript-migration
