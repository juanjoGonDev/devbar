name: Temporary release fix generation

on:
  push:
    branches:
      - fix/release-impact-gating

permissions:
  contents: write

concurrency:
  group: tmp-release-fix-generation-${{ github.repository }}
  cancel-in-progress: true

jobs:
  generate:
    if: >-
      github.repository == 'juanjoGonDev/devbar' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install reproducibly
        run: pnpm install --frozen-lockfile

      - name: Format release impact tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            tests/release-impact-policy.test.ts \
            tests/release-workflow-impact.test.ts
          if ! git diff --quiet -- \
            tests/release-impact-policy.test.ts \
            tests/release-workflow-impact.test.ts; then
            git config user.name "$GITHUB_ACTOR"
            git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
            git add \
              tests/release-impact-policy.test.ts \
              tests/release-workflow-impact.test.ts
            git commit -m "style(release): format impact policy tests"
          fi

      - name: Patch nanoid override and regenerate lockfile
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.pnpm.overrides.nanoid = '3.3.18';
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          pnpm install --lockfile-only --ignore-scripts
          pnpm audit --audit-level=moderate
          if ! git diff --quiet -- package.json pnpm-lock.yaml; then
            git config user.name "$GITHUB_ACTOR"
            git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
            git add package.json pnpm-lock.yaml
            git commit -m "fix(deps): patch nanoid security override"
          fi

      - name: Push generated commits
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"
