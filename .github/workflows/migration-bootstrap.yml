name: Migration workspace bootstrap

on:
  push:
    branches:
      - refactor/typescript-migration

permissions: read-all

concurrency:
  group: migration-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Create source archive
        run: tar --exclude=.git -czf /tmp/devbar-source.tgz .

      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: migration-source-${{ github.sha }}
          path: /tmp/devbar-source.tgz
          retention-days: 1
          if-no-files-found: error
