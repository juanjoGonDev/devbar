name: 🚀 Auto release PR

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Create a release PR even with fewer than three commits
        required: true
        default: false
        type: boolean
      strategy:
        description: Version bump strategy
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: Calculate the release without creating a branch or pull request
        required: true
        default: true
        type: boolean

permissions: read-all

concurrency:
  group: auto-release-pr
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare GitHub release PR
    if: github.repository == 'juanjoGonDev/devbar' && github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      AUTOMATION_TOKEN: ${{ secrets.REPOSITORY_AUTOMATION_TOKEN || secrets.PAT_FINE }}
      FORCE_RELEASE: ${{ inputs.force || false }}
      RELEASE_STRATEGY: ${{ inputs.strategy || 'auto' }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - name: Explain missing user automation token
        if: env.AUTOMATION_TOKEN == '' && env.DRY_RUN != 'true'
        run: |
          echo "::error title=Repository automation token missing::Configure REPOSITORY_AUTOMATION_TOKEN or PAT_FINE as an Actions secret. It must belong to the repository owner and grant Contents and Pull requests read/write."
          exit 1

      - name: Synchronize release label
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "auto-release" \
            --repo "$GITHUB_REPOSITORY" \
            --color "FEF2C0" \
            --description "Automatically prepares a version bump and GitHub release" \
            --force

      - name: Checkout trusted default branch
        if: env.AUTOMATION_TOKEN != '' || env.DRY_RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release
        if: env.AUTOMATION_TOKEN != '' || env.DRY_RUN == 'true'
        id: release
        env:
          GH_TOKEN: ${{ env.AUTOMATION_TOKEN || github.token }}
        run: |
          latest_tag=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          if [ -n "$latest_tag" ]; then
            range="$latest_tag..HEAD"
          else
            range="HEAD"
          fi

          commit_count=$(git rev-list --count "$range")
          if [ "$FORCE_RELEASE" != "true" ] && [ "$commit_count" -lt 3 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Only $commit_count commits since ${latest_tag:-repository start}; at least 3 are required."
            exit 0
          fi

          strategy="$RELEASE_STRATEGY"
          if [ "$strategy" = "auto" ]; then
            if git log "$range" --format='%s%n%b' | grep -Eq '(^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE:)'; then
              strategy=major
            elif git log "$range" --format='%s' | grep -Eq '^feat(\([^)]*\))?:'; then
              strategy=minor
            else
              strategy=patch
            fi
          fi

          current_version=$(node -p "require('./package.json').version")
          next_version=$(node -e "
          const [major, minor, patch] = process.argv[1].split('.').map(Number);
          const strategy = process.argv[2];
          const versions = {
            major: [major + 1, 0, 0],
            minor: [major, minor + 1, 0],
            patch: [major, minor, patch + 1],
          };
          process.stdout.write(versions[strategy].join('.'));
          " "$current_version" "$strategy")

          if gh release view "v$next_version" >/dev/null 2>&1; then
            echo "Release v$next_version already exists."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh pr list \
            --state open \
            --search "head:release/v$next_version" \
            --json number \
            --jq 'length > 0' | grep -q true; then
            echo "Release PR for v$next_version already exists."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "strategy=$strategy" >> "$GITHUB_OUTPUT"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          echo "commit_count=$commit_count" >> "$GITHUB_OUTPUT"

      - name: Show dry-run result
        if: steps.release.outputs.ready == 'true' && env.DRY_RUN == 'true'
        run: |
          echo "Would create release/v${{ steps.release.outputs.version }}"
          echo "Strategy: ${{ steps.release.outputs.strategy }}"
          echo "Commits: ${{ steps.release.outputs.commit_count }}"

      - name: Create version bump pull request
        id: create_pr
        if: steps.release.outputs.ready == 'true' && env.DRY_RUN != 'true' && env.AUTOMATION_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.AUTOMATION_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          STRATEGY: ${{ steps.release.outputs.strategy }}
          COMMIT_COUNT: ${{ steps.release.outputs.commit_count }}
        run: |
          branch="release/v$VERSION"
          actor_login=$(gh api user --jq .login)
          if [ "$actor_login" != "$GITHUB_REPOSITORY_OWNER" ]; then
            echo "::error title=Invalid release automation actor::The automation token authenticates as $actor_login, but this repository requires $GITHUB_REPOSITORY_OWNER."
            exit 1
          fi

          git config user.name "$actor_login"
          git config user.email "$actor_login@users.noreply.github.com"
          npm version "$VERSION" --no-git-tag-version
          git checkout -b "$branch"
          git add package.json
          git commit -m "chore(release): prepare v$VERSION"

          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$authorization"
          git -c http.extraheader="Authorization: Basic $authorization" \
            push "https://github.com/$GITHUB_REPOSITORY.git" "$branch"

          pr_url=$(gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "chore(release): prepare v$VERSION" \
            --label "auto-release" \
            --body "Automated **$STRATEGY** release from $COMMIT_COUNT commits. Merging this PR builds a universal macOS DMG and ZIP and publishes them in GitHub Releases.")
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Queue release pull request
        if: steps.create_pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ env.AUTOMATION_TOKEN }}
          PR_URL: ${{ steps.create_pr.outputs.pr_url }}
          HEAD_SHA: ${{ steps.create_pr.outputs.head_sha }}
        run: |
          gh pr merge "$PR_URL" \
            --auto \
            --squash \
            --match-head-commit "$HEAD_SHA"
