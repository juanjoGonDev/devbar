name: log-extract (temporary)

on:
  workflow_dispatch:
    inputs:
      job_ids:
        description: 'Comma-separated GitHub Actions job ids (default: latest failures on this branch)'
        required: false
        type: string
  push:
    branches:
      - arena/01a09cad-devbar

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve failed job ids
        if: ${{ inputs.job_ids == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: arena/01a09cad-devbar
        run: |
          set -euo pipefail
          ids=$(
            gh api "repos/$REPO/actions/runs?branch=$BRANCH&per_page=15&status=completed" \
              --jq '.workflow_runs[].id' \
              | while read -r run; do
                  gh api "repos/$REPO/actions/runs/$run/jobs" \
                    --jq '.jobs[] | select(.conclusion == "failure") | .id'
                done \
              | sort -u | head -6 | paste -sd, -
          )
          echo "resolved job ids: ${ids:-none}"
          echo "RESOLVED_IDS=$ids" >> "$GITHUB_ENV"

      - name: Fetch job logs
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_IDS: ${{ inputs.job_ids || env.RESOLVED_IDS }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -n "$JOB_IDS" ] || { echo "no failed jobs to log"; exit 0; }
          IFS=',' read -ra IDS <<<"$JOB_IDS"
          for id in "${IDS[@]}"; do
            id="$(echo "$id" | tr -d '[:space:]')"
            [ -z "$id" ] && continue
            curl -sL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/jobs/$id/logs" \
              -o "job-$id.log"
            echo "fetched job-$id.log ($(wc -c < "job-$id.log") bytes)"
          done

      - name: Save logs to branch
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_IDS: ${{ inputs.job_ids || env.RESOLVED_IDS }}
        run: |
          set -euo pipefail
          [ -n "$JOB_IDS" ] || { echo "nothing to save"; exit 0; }
          git clone --depth 1 --branch arena/01a09cad-devbar \
            "https://x-access-token:$GH_TOKEN@github.com/${GITHUB_REPOSITORY}.git" ws
          mkdir -p ws/.ci-debug
          IFS=',' read -ra IDS <<<"$JOB_IDS"
          for id in "${IDS[@]}"; do
            id="$(echo "$id" | tr -d '[:space:]')"
            [ -z "$id" ] && continue
            cp "job-$id.log" "ws/.ci-debug/job-$id.log"
          done
          cd ws
          git config user.name "ci-debug-bot"
          git config user.email "ci-debug-bot@users.noreply.github.com"
          git add -f .ci-debug
          if git commit -m "ci: temporary job logs"; then
            git push
          else
            echo "no log changes to commit"
          fi
