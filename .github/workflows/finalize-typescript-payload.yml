name: Finalize TypeScript migration payload

on:
  push:
    branches:
      - refactor/typescript-migration

permissions:
  contents: write

concurrency:
  group: finalize-typescript-migration-payload
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository == 'juanjoGonDev/devbar' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Decode and apply migration
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          payload_parts=(.migration-transport/data-*)
          if (( ${#payload_parts[@]} == 0 )); then
            echo '::error::No data-* migration payload parts found.'
            exit 1
          fi

          cat "${payload_parts[@]}" | tr -d '\r\n ' > /tmp/typescript-migration.b64
          base64 --decode /tmp/typescript-migration.b64 > /tmp/typescript-migration.xz
          xz -t /tmp/typescript-migration.xz
          xz -dc /tmp/typescript-migration.xz > /tmp/typescript-migration.patch

          if ! grep -q '^diff --git ' /tmp/typescript-migration.patch; then
            echo '::error::Decoded payload is not a Git patch.'
            head -c 200 /tmp/typescript-migration.patch || true
            exit 1
          fi

          if git apply --check /tmp/typescript-migration.patch; then
            git apply --index /tmp/typescript-migration.patch
          else
            git apply --3way --index /tmp/typescript-migration.patch
          fi

          git rm -r .migration-transport
          git rm .agents/_probe-do-not-create
          git rm .github/workflows/finalize-typescript-payload.yml

          if [[ -n "$(git ls-files '*.js' '*.jsx' '*.mjs' '*.cjs')" ]]; then
            echo '::error::Authored JavaScript-family files remain after migration.'
            git ls-files '*.js' '*.jsx' '*.mjs' '*.cjs'
            exit 1
          fi

          git diff --cached --check
          git status --short

      - name: Publish migration to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(typescript): publish strict TypeScript migration'
          git push origin HEAD:refactor/typescript-migration
