name: Repair release lockfile

on:
  push:
    branches: [release/v0.2.0]

permissions: read-all

concurrency:
  group: repair-release-lockfile
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'juanjoGonDev/devbar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: release/v0.2.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Remove duplicated lockfile snapshot
        shell: python
        run: |
          from pathlib import Path

          path = Path('pnpm-lock.yaml')
          duplicate = (
              '  fdir@6.5.0(picomatch@4.0.5):\n'
              '    optionalDependencies:\n'
              '      picomatch: 4.0.5\n\n'
          )
          content = path.read_text(encoding='utf-8')
          if content.count(duplicate) != 2:
              raise SystemExit('Expected exactly two duplicated fdir snapshots')

          first_index = content.index(duplicate)
          second_index = content.index(duplicate, first_index + len(duplicate))
          path.write_text(
              content[:second_index] + content[second_index + len(duplicate):],
              encoding='utf-8',
          )

      - name: Validate frozen lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Commit repaired lockfile
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git diff --cached --quiet && { echo 'No lockfile repair produced'; exit 1; }
          git commit -m 'fix(deps): repair duplicated lockfile snapshot'
          git push origin HEAD:release/v0.2.0
