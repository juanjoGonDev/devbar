name: ✅ Trusted post-CI auto-merge

on:
  workflow_run:
    workflows:
      - CI
      - CodeQL Advanced
    types:
      - completed

permissions: read-all

concurrency:
  group: trusted-auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    name: Merge trusted pull request after required checks
    if: >-
      github.repository == 'juanjoGonDev/devbar' &&
      github.event.repository.fork == false &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Verify current head and merge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const repository = context.payload.repository;
            const completedRun = context.payload.workflow_run;
            const headSha = completedRun.head_sha;
            const pullReference = completedRun.pull_requests?.[0];

            if (!pullReference) {
              core.info(`No pull request is associated with ${headSha}.`);
              return;
            }

            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullReference.number,
            });
            const labels = new Set(pull.labels.map((label) => label.name));
            const sameRepository = pull.head.repo?.full_name === repository.full_name;
            const targetsDefaultBranch = pull.base.ref === repository.default_branch;
            const isRelease =
              labels.has('auto-release') && pull.user?.login === repository.owner.login;
            const isDependabot =
              labels.has('auto-merge-eligible') &&
              pull.user?.login === 'dependabot[bot]';

            if (
              pull.state !== 'open' ||
              pull.draft ||
              pull.head.sha !== headSha ||
              !sameRepository ||
              !targetsDefaultBranch ||
              (!isRelease && !isDependabot)
            ) {
              core.info(`Pull request #${pull.number} is not eligible for trusted auto-merge.`);
              return;
            }

            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number: pull.number, per_page: 100 },
            );
            const requiredApprover = isRelease
              ? 'github-actions[bot]'
              : repository.owner.login;
            const approvedCurrentHead = reviews.some(
              (review) =>
                review.user?.login === requiredApprover &&
                review.state === 'APPROVED' &&
                review.commit_id === headSha,
            );

            if (!approvedCurrentHead) {
              core.info(
                `Pull request #${pull.number} lacks the required ${requiredApprover} approval for ${headSha}.`,
              );
              return;
            }

            const workflowRuns = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner,
                repo,
                event: 'pull_request',
                head_sha: headSha,
                per_page: 100,
              },
            );
            const requiredWorkflows = ['CI', 'CodeQL Advanced'];
            const latestRequiredRuns = new Map();

            for (const run of workflowRuns) {
              if (!requiredWorkflows.includes(run.name) || run.head_sha !== headSha) {
                continue;
              }

              const current = latestRequiredRuns.get(run.name);
              if (!current || run.run_number > current.run_number) {
                latestRequiredRuns.set(run.name, run);
              }
            }

            const incompleteWorkflows = requiredWorkflows.filter((name) => {
              const run = latestRequiredRuns.get(name);
              return !run || run.status !== 'completed' || run.conclusion !== 'success';
            });

            if (incompleteWorkflows.length > 0) {
              core.info(
                `Waiting for successful required workflows: ${incompleteWorkflows.join(', ')}.`,
              );
              return;
            }

            const { data: currentPull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pull.number,
            });
            if (currentPull.state !== 'open' || currentPull.head.sha !== headSha) {
              core.info(`Pull request #${pull.number} changed before merge.`);
              return;
            }

            const { data: result } = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pull.number,
              merge_method: 'squash',
              sha: headSha,
            });

            if (!result.merged) {
              core.setFailed(result.message || `GitHub rejected pull request #${pull.number}.`);
              return;
            }

            core.info(`Merged trusted pull request #${pull.number} at ${headSha}.`);
