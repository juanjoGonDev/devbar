            6ac673e4e44ef888c1ae2cb30c5b6cca3c330f70
            af4f528d9cc1c55b34a289d93321293be60d3d4f
          )

          : > /tmp/devbar-overlay.b64
          for sha in "${shas[@]}"; do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq '.content' \
              | tr -d '\r\n' \
              | base64 --decode >> /tmp/devbar-overlay.b64
          done

          actual_length=$(wc -c < /tmp/devbar-overlay.b64)
          if [[ "$actual_length" -ne "$expected_length" ]]; then
            echo "::error::Overlay Base64 length mismatch (actual=$actual_length expected=$expected_length)."
            exit 1
          fi

          base64 --decode /tmp/devbar-overlay.b64 > /tmp/devbar-overlay.tar.xz
          actual_sha=$(sha256sum /tmp/devbar-overlay.tar.xz | awk '{print $1}')
          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "::error::Overlay checksum mismatch (actual=$actual_sha expected=$expected_sha)."
            exit 1
          fi
          xz -t /tmp/devbar-overlay.tar.xz
          echo "Verified overlay sha256=$actual_sha"

      - name: Materialize strict TypeScript tree
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t jsfiles < <(git ls-files '*.js' '*.jsx' '*.mjs' '*.cjs')
          if (( ${#jsfiles[@]} )); then
            git rm -f -- "${jsfiles[@]}"
          fi

          git rm -rf --ignore-unmatch \
            .migration-final .migration-transport .migration-delivery-v2 \
            .agents/.typescript-upload .agents/.blob-check .agents/.verify \
            .agents/_probe-do-not-create .agents/DO-NOT-CREATE \
            .github/workflows/finalize-typescript-payload.yml \
            .github/workflows/materialize-typescript.yml \
            .github/workflows/materialize-typescript-blobs.yml

          tar -xJf /tmp/devbar-overlay.tar.xz -C .

          git add -u -- .
          while IFS= read -r path; do
            git add -- "$path"
          done < <(tar -tJf /tmp/devbar-overlay.tar.xz)

          # This Actions token cannot update workflow files. Keep the current
          # workflow directory unchanged; the connected GitHub app publishes the
          # permanent workflow set atomically after this source commit lands.
          git restore --source=HEAD --staged --worktree -- .github/workflows

          if [[ -n "$(git ls-files '*.js' '*.jsx' '*.mjs' '*.cjs')" ]]; then
            echo '::error::Authored JavaScript-family files remain after migration.'
            git ls-files '*.js' '*.jsx' '*.mjs' '*.cjs'
            exit 1
          fi
          if git ls-files | grep -Eq '^(\.migration-|\.agents/(\.verify|\.typescript-upload|\.blob-check|_probe-do-not-create|DO-NOT-CREATE))'; then
            echo '::error::Temporary migration/probe files remain tracked outside workflows.'
            git ls-files | grep -E '^(\.migration-|\.agents/(\.verify|\.typescript-upload|\.blob-check|_probe-do-not-create|DO-NOT-CREATE))' || true
            exit 1
          fi

          git diff --cached --check
          git status --short
          git diff --cached --stat

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(typescript): publish strict TypeScript migration'
          git push origin HEAD:refactor/typescript-migration
