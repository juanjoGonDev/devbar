name: Materialize verified TypeScript migration

on:
  push:
    branches:
      - refactor/typescript-migration
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: materialize-verified-typescript-migration
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.repository == 'juanjoGonDev/devbar' &&
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'push' || github.head_ref == 'refactor/typescript-migration')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refactor/typescript-migration
          persist-credentials: true
          fetch-depth: 0

      - name: Reconstruct and verify final overlay
        shell: bash
        run: |
          set -euo pipefail
          expected_length=227372
          expected_sha='57d21d1c7038f3c3f1928889690b89a64f2ae30dc07498a34bf58bbf2eef33cc'
          shas=(
            7adcd09285aabe2345b1effeb0466079c40e1362
            cc51116faf8bbd7287a57af3389b9ec3543c20b5
