name: Release validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-validation.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/build-macos-release.sh'
      - 'scripts/package-electron.js'
      - 'scripts/package-macos-app.sh'
      - 'scripts/release-artifacts.js'
      - 'scripts/verify-release-artifacts.js'
      - 'scripts/verify-macos-release.sh'
      - 'tests/release-artifacts.test.js'

permissions: read-all

concurrency:
  group: release-validation-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: macOS release dry run
    if: >-
      github.repository == 'juanjoGonDev/devbar' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.draft == false)
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Electron downloads
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/Library/Caches/electron
          key: macos-release-validation-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit release dependency graph
        run: pnpm audit --audit-level=moderate

      - name: Run release artifact regression tests
        run: pnpm exec vitest run tests/release-artifacts.test.js

      - name: Build and verify release without publishing
        run: pnpm run release:mac

      - name: Record release plan
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          {
            echo "tag=v$version"
            echo "target=$TARGET_SHA"
            echo 'publication=false'
            echo 'assets:'
            sed 's/^/  /' dist/release/SHA256SUMS.txt
          } > dist/release/RELEASE_VALIDATION.txt

      - name: Upload dry-run evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-validation-${{ github.sha }}
          retention-days: 3
          if-no-files-found: error
          path: |
            dist/release/SHA256SUMS.txt
            dist/release/RELEASE_VALIDATION.txt
