name: Materialize strict TypeScript migration

on:
  push:
    branches:
      - refactor/typescript-migration

permissions:
  contents: write

concurrency:
  group: materialize-typescript-migration
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'juanjoGonDev/devbar' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Verify and publish TypeScript tree
        shell: bash
        run: |
          set -euo pipefail
          overlay='.agents/.verify/local-file-param'
          expected='e623b48cdcf56703dea5b71567be34d0183ed2d3514271f7856d8d6bea2bfc01'

          if [[ ! -f "$overlay" ]]; then
            echo '::error::Validated overlay file is missing.'
            exit 1
          fi

          actual=$(sha256sum "$overlay" | awk '{print $1}')
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Overlay checksum mismatch (actual=$actual). Refusing to modify the source tree."
            exit 1
          fi
          xz -t "$overlay"

          # Apply the exact locally validated final tree.
          tar -xJf "$overlay" -C .

          # Remove every authored JavaScript-family source from the pre-migration tree.
          mapfile -t jsfiles < <(git ls-files '*.js' '*.jsx' '*.mjs' '*.cjs')
          if (( ${#jsfiles[@]} )); then
            git rm -f -- "${jsfiles[@]}"
          fi

          # Remove all migration-only transport/debug artifacts, including this workflow.
          rm -rf .migration-transport .migration-final .agents/.typescript-upload .agents/.blob-check .agents/.verify
          rm -f .agents/_probe-do-not-create .agents/DO-NOT-CREATE
          rm -f .github/workflows/finalize-typescript-payload.yml .github/workflows/materialize-typescript.yml

          git add -A

          if [[ -n "$(git ls-files '*.js' '*.jsx' '*.mjs' '*.cjs')" ]]; then
            echo '::error::Authored JavaScript-family files remain after migration.'
            git ls-files '*.js' '*.jsx' '*.mjs' '*.cjs'
            exit 1
          fi
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(typescript): publish strict TypeScript migration'
          git push origin HEAD:refactor/typescript-migration
