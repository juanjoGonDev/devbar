name: Release

on:
  push:
    branches:
      - main
  # No dispatch inputs: any workflow input is a CodeQL taint source, and a
  # tainted ref reaching a checkout/cache step in this default-branch
  # workflow is a cache-poisoning alert. The dispatch path recovers the
  # version currently in package.json on main (detect checks it against the
  # live tag and release state), so it needs no operator-supplied data.
  workflow_dispatch:

permissions: read-all

# A newer push to main cancels the in-flight release entirely: a merged PR
# stack lands as several pushes, and only the last HEAD carries every PR.
# Cancelling is safe because the release is built as a DRAFT and only
# published (which creates the tag) as the very last step; the cleanup job
# removes what a cancelled run left behind, and the next detect self-heals
# whatever the cleanup could not.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: true

jobs:
  detect:
    name: Decide whether HEAD publishes the current version
    if: >-
      github.repository == 'juanjoGonDev/devbar' &&
      github.event.repository.fork == false &&
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      tag_at_head: ${{ steps.release.outputs.tag_at_head }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for release policy
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Decide release for the current version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          current_version=$(node -p "require('./package.json').version")
          if ! [[ "$current_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=Invalid release version::$current_version is not a stable semantic version."
            exit 1
          fi
          release_tag="v${current_version}"

          # Every release carrying this tag name. A draft has no git tag yet
          # and several drafts may share one name. Best effort: drafts are
          # only listed for tokens with push access, so the publish job
          # re-reads this state with contents: write before acting on it.
          release_state=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -s -r --arg tag "$release_tag" '
                [add // [] | .[] | select(.tag_name == $tag)] as $matches
                | if any($matches[]; .draft == false) then "published"
                  elif ($matches | length) > 0 then "draft"
                  else "none" end')

          latest_release_tag=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')

          existing_tag_sha=
          if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${release_tag}:refs/tags/${release_tag}"
            existing_tag_sha=$(git rev-list -n 1 "$release_tag")
          fi

          # A push publishes only with release-impacting commits since the
          # latest published release; recovery (workflow_dispatch) skips the
          # check, and a published current version never needs it.
          pending_impact=unknown
          if [[ "$EVENT_NAME" == "push" && "$release_state" != "published" && -n "$latest_release_tag" ]]; then
            git fetch --force origin "refs/tags/${latest_release_tag}:refs/tags/${latest_release_tag}"
            latest_release_sha=$(git rev-list -n 1 "$latest_release_tag")
            if ! git merge-base --is-ancestor "$latest_release_sha" "$GITHUB_SHA"; then
              echo "::error title=Invalid release impact baseline::$latest_release_tag is not an ancestor of $GITHUB_SHA."
              exit 1
            fi
            impact_json=$(node --experimental-strip-types scripts/release-impact-policy.ts pending "$latest_release_tag" "$GITHUB_SHA")
            pending_impact=$(jq -r .publish <<<"$impact_json")
          fi

          decision=$(node --experimental-strip-types scripts/release-decision.ts \
            --current "$current_version" \
            --latest "${latest_release_tag#v}" \
            --state "$release_state" \
            --tag-sha "$existing_tag_sha" \
            --head "$GITHUB_SHA" \
            --event "$EVENT_NAME" \
            --impact "$pending_impact")
          action=$(jq -r .action <<<"$decision")
          reason=$(jq -r .reason <<<"$decision")

          case "$action" in
            fail)
              echo "::error title=Release decision failed::$reason"
              exit 1
              ;;
            skip)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "$reason"
              exit 0
              ;;
            heal)
              echo "::warning title=Healing interrupted release::$reason"
              ;;
            publish)
              echo "$reason"
              ;;
            *)
              echo "::error title=Unknown release decision::$action"
              exit 1
              ;;
          esac

          {
            echo "publish=true"
            echo "version=$current_version"
            echo "release_tag=$release_tag"
            echo "tag_at_head=$(jq -r .tagAtHead <<<"$decision")"
          } >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build & verify macOS installers
    needs: detect
    if: needs.detect.outputs.publish == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      # Plain default-branch checkout (the event sha — an immutable ref).
      # CodeQL treats any checkout whose ref comes from another job's
      # outputs as untrusted code in this cache-writable workflow; the
      # release tag targets this same event sha, so build and tag agree.
      - name: Checkout release HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: macos-installer-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and verify Intel and Apple Silicon installers
        run: pnpm run release:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-${{ needs.detect.outputs.version }}
          retention-days: 1
          if-no-files-found: error
          path: |
            dist/release/DevBar-${{ needs.detect.outputs.version }}-macos-arm64.dmg
            dist/release/DevBar-${{ needs.detect.outputs.version }}-macos-arm64.zip
            dist/release/DevBar-${{ needs.detect.outputs.version }}-macos-x64.dmg
            dist/release/DevBar-${{ needs.detect.outputs.version }}-macos-x64.zip

  build-windows:
    name: Build & verify Windows installers
    needs: detect
    if: needs.detect.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # Plain default-branch checkout (the event sha — an immutable ref).
      # CodeQL treats any checkout whose ref comes from another job's
      # outputs as untrusted code in this cache-writable workflow; the
      # release tag targets this same event sha, so build and tag agree.
      - name: Checkout release HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: windows-installer-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and verify NSIS + portable (x64, arm64)
        shell: bash
        run: |
          # electron-builder downloads Electron dists + toolsets (NSIS)
          # from GitHub releases; a transient 5xx must not fail the
          # release — retry before giving up (same wrapper as ci.yml).
          ok=0
          for attempt in 1 2 3; do
            if pnpm run dist; then ok=1; break; fi
            echo "::warning::dist (win) failed on attempt ${attempt} (transient download?) — retrying in 30s"
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          if [ "$ok" != 1 ]; then echo "dist (win) failed after 3 attempts"; exit 1; fi
          pnpm run verify

      - name: Launch smoke — NSIS install + portable
        shell: pwsh
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:VERSION
          Start-Process -Wait -FilePath ".\dist\electron-builder\DevBar-$version-win-x64-setup.exe" -ArgumentList '/S'
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\DevBar\DevBar.exe")) {
            Write-Error "NSIS install did not produce the expected exe"
            exit 1
          }
          # The oneClick installer launches the app at the end of the install;
          # stop that instance so the smoke launch owns the single-instance lock.
          Get-Process DevBar -ErrorAction SilentlyContinue | Stop-Process -Force
          & "$env:LOCALAPPDATA\Programs\DevBar\DevBar.exe" --devbar-smoke *>&1 |
            Tee-Object -FilePath smoke-win-installed.log
          if (-not (Select-String -Path smoke-win-installed.log -Pattern 'DEVBAR_SMOKE_OK' -Quiet)) {
            Write-Error 'installed-app smoke failed'
            exit 1
          }
          # The NSIS portable wrapper runs the real app as a child process
          # without redirecting its stdio, so its DEVBAR_SMOKE_OK line never
          # reaches this console. The app writes a marker file on smoke
          # success (removed at smoke start), and the wrapper only returns
          # once the child exits — so the marker is settled now.
          # Clear a marker the EARLIER smoke in this job (the NSIS install)
          # may have left: the app only removes its own at app.ready, so an
          # exe that dies before that would pass the Test-Path gate on the
          # stale file.
          Remove-Item (Join-Path $env:TEMP 'devbar-smoke-ok') -ErrorAction SilentlyContinue
          & ".\dist\electron-builder\DevBar-$version-win-x64-portable.exe" --devbar-smoke *>&1 |
            Out-File -FilePath smoke-win-portable.log -Encoding utf8
          if (-not (Test-Path (Join-Path $env:TEMP 'devbar-smoke-ok'))) {
            Write-Error 'portable-app smoke failed (no smoke marker)'
            exit 1
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-${{ needs.detect.outputs.version }}
          retention-days: 1
          if-no-files-found: error
          path: |
            dist/electron-builder/DevBar-${{ needs.detect.outputs.version }}-win-x64-setup.exe
            dist/electron-builder/DevBar-${{ needs.detect.outputs.version }}-win-x64-portable.exe
            dist/electron-builder/DevBar-${{ needs.detect.outputs.version }}-win-arm64-setup.exe
            dist/electron-builder/DevBar-${{ needs.detect.outputs.version }}-win-arm64-portable.exe

  build-linux:
    name: Build & verify Linux packages (incl. Raspberry Pi)
    needs: detect
    if: needs.detect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # Plain default-branch checkout (the event sha — an immutable ref).
      # CodeQL treats any checkout whose ref comes from another job's
      # outputs as untrusted code in this cache-writable workflow; the
      # release tag targets this same event sha, so build and tag agree.
      - name: Checkout release HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: linux-installer-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and verify AppImage + deb (x64, arm64, armv7)
        run: |
          # electron-builder downloads Electron dists + toolsets (NSIS,
          # fpm, appimagetool) from GitHub releases; a transient 5xx must
          # not fail the release — retry before giving up (same wrapper
          # as ci.yml).
          ok=0
          for attempt in 1 2 3; do
            if pnpm run dist; then ok=1; break; fi
            echo "::warning::dist (linux) failed on attempt ${attempt} (transient download?) — retrying in 30s"
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          if [ "$ok" != 1 ]; then echo "dist (linux) failed after 3 attempts"; exit 1; fi
          pnpm run verify

      - name: Launch smoke — AppImage + deb (x64, host arch)
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          # Hosted runners have no /dev/fuse: extract-and-run executes the
          # same payload a mounted AppImage would (same fix as ci.yml and
          # release-validation.yml).
          xvfb-run -a "dist/electron-builder/DevBar-${VERSION}-linux-x64.AppImage" --appimage-extract-and-run --devbar-smoke 2>&1 | tee smoke-linux-appimage.log
          grep -q DEVBAR_SMOKE_OK smoke-linux-appimage.log
          # .deb: apt resolves the Electron runtime libraries the runner
          # image lacks (plain dpkg -i fails on unmet dependencies).
          sudo apt-get install -y "./dist/electron-builder/DevBar-${VERSION}-linux-x64.deb"
          xvfb-run -a /usr/bin/devbar --devbar-smoke 2>&1 | tee smoke-linux-deb.log
          grep -q DEVBAR_SMOKE_OK smoke-linux-deb.log

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ needs.detect.outputs.version }}
          retention-days: 1
          if-no-files-found: error
          path: |
            dist/electron-builder/DevBar-${{ needs.detect.outputs.version }}-linux-x64.AppImage
            dist/electron-builder/DevBar-${{ needs.detect.outputs.version }}-linux-x64.deb
            dist/electron-builder/DevBar-${{ needs.detect.outputs.version }}-linux-arm64.AppImage
            dist/electron-builder/DevBar-${{ needs.detect.outputs.version }}-linux-arm64.deb
            dist/electron-builder/DevBar-${{ needs.detect.outputs.version }}-linux-armv7.AppImage
            dist/electron-builder/DevBar-${{ needs.detect.outputs.version }}-linux-armv7.deb

  assemble:
    name: Assemble and verify the full release set
    needs: ['detect', 'build-macos', 'build-windows', 'build-linux']
    if: needs.detect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Plain default-branch checkout (the event sha — an immutable ref).
      # CodeQL treats any checkout whose ref comes from another job's
      # outputs as untrusted code in this cache-writable workflow; the
      # release tag targets this same event sha, so build and tag agree.
      - name: Checkout release HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install and build (for the release tooling)
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Download macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos-${{ needs.detect.outputs.version }}
          path: dist/release

      - name: Download Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-windows-${{ needs.detect.outputs.version }}
          path: dist/release

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux-${{ needs.detect.outputs.version }}
          path: dist/release

      - name: Write full SHA256SUMS manifest and verify the complete set
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          node build/scripts/release-manifest.js dist/release "$VERSION"
          node build/scripts/verify-release-artifacts.js dist/release "$VERSION"

      - name: Upload final release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-final-${{ needs.detect.outputs.version }}
          retention-days: 1
          if-no-files-found: error
          path: dist/release

  publish:
    name: Publish release
    # Deliberately no checkout: a privileged job must never check out a ref
    # derived from another job's outputs (CodeQL privileged-checkout rule).
    # Everything this job needs arrives as a verified build artifact, and
    # tag/release operations use the GitHub API instead of local git.
    #
    # Draft first, publish last: the release is created as a DRAFT (GitHub
    # creates no git tag for a draft, and drafts are excluded from
    # /releases/latest and from unauthenticated listings, so the in-app
    # updater never sees one), every asset is uploaded and checked against
    # SHA256SUMS.txt, and only the final step flips it to published, which
    # is when GitHub creates the tag at the event sha. A run cancelled before
    # that step leaves at most a draft, which cleanup or the next run removes.
    needs: ['detect', 'assemble']
    if: needs.detect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: admin
    permissions:
      contents: write
    # No checkout in this job, so `gh` has no local .git to infer the repo
    # from. GH_REPO gives every invocation the context.
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.detect.outputs.version }}
      RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}
    steps:
      - name: Download verified release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-final-${{ needs.detect.outputs.version }}
          path: dist/release

      - name: Verify the release set against SHA256SUMS
        run: |
          set -euo pipefail
          printf '%s\n' \
            "DevBar-${VERSION}-macos-arm64.dmg" \
            "DevBar-${VERSION}-macos-arm64.zip" \
            "DevBar-${VERSION}-macos-x64.dmg" \
            "DevBar-${VERSION}-macos-x64.zip" \
            "DevBar-${VERSION}-win-x64-setup.exe" \
            "DevBar-${VERSION}-win-x64-portable.exe" \
            "DevBar-${VERSION}-win-arm64-setup.exe" \
            "DevBar-${VERSION}-win-arm64-portable.exe" \
            "DevBar-${VERSION}-linux-x64.AppImage" \
            "DevBar-${VERSION}-linux-x64.deb" \
            "DevBar-${VERSION}-linux-arm64.AppImage" \
            "DevBar-${VERSION}-linux-arm64.deb" \
            "DevBar-${VERSION}-linux-armv7.AppImage" \
            "DevBar-${VERSION}-linux-armv7.deb" \
            "SHA256SUMS.txt" \
            | LC_ALL=C sort > "$RUNNER_TEMP/expected-assets.txt"

          cd dist/release
          find . -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort | diff -u "$RUNNER_TEMP/expected-assets.txt" -
          sha256sum --check --strict SHA256SUMS.txt
          sed -E 's/^[0-9a-f]{64} [ *]//' SHA256SUMS.txt | LC_ALL=C sort \
            | diff -u <(grep -vx 'SHA256SUMS.txt' "$RUNNER_TEMP/expected-assets.txt") -

      - name: Remove unpublished leftovers of an interrupted run
        run: |
          set -euo pipefail
          # Re-read the live state with write access (detect may not see
          # drafts). A published release is never touched: abort instead.
          releases=$(gh api --paginate "repos/${GH_REPO}/releases?per_page=100" \
            | jq -s -c --arg tag "$RELEASE_TAG" '[add // [] | .[] | select(.tag_name == $tag) | {id, draft}]')
          if jq -e 'any(.[]; .draft == false)' <<<"$releases" >/dev/null; then
            echo "::error title=Release already published::$RELEASE_TAG is published; it is never touched."
            exit 1
          fi
          for release_id in $(jq -r '.[].id' <<<"$releases"); do
            echo "Deleting leftover draft release $release_id for $RELEASE_TAG."
            gh api --method DELETE "repos/${GH_REPO}/releases/${release_id}" >/dev/null \
              || echo "Draft $release_id is already gone."
          done

          if gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            # commits/tags/{tag} dereferences annotated tags to the commit.
            tag_sha=$(gh api "repos/${GH_REPO}/commits/tags/${RELEASE_TAG}" --jq '.sha')
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "::warning title=Leftover release tag::Deleting unpublished $RELEASE_TAG at $tag_sha; the release is tagged at $GITHUB_SHA."
              gh api --method DELETE "repos/${GH_REPO}/git/refs/tags/${RELEASE_TAG}" >/dev/null
            fi
          fi

      - name: Create draft release with every asset
        id: draft
        run: |
          set -euo pipefail
          mapfile -t assets < "$RUNNER_TEMP/expected-assets.txt"
          gh release create "$RELEASE_TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "DevBar $RELEASE_TAG" \
            --generate-notes \
            "${assets[@]/#/dist/release/}"

          release_id=$(gh api --paginate "repos/${GH_REPO}/releases?per_page=100" \
            | jq -s -r --arg tag "$RELEASE_TAG" '
                [add // [] | .[] | select(.tag_name == $tag and .draft)]
                | if length == 1 then .[0].id else error("expected exactly one draft for \($tag), found \(length)") end')
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Verify draft assets against SHA256SUMS
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          release_json=$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}")
          [[ "$(jq -r .draft <<<"$release_json")" == "true" ]]
          [[ "$(jq -r .prerelease <<<"$release_json")" == "false" ]]
          [[ "$(jq -r .tag_name <<<"$release_json")" == "$RELEASE_TAG" ]]

          jq -r '.assets[].name' <<<"$release_json" | LC_ALL=C sort \
            | diff -u "$RUNNER_TEMP/expected-assets.txt" -

          while IFS= read -r name; do
            asset=$(jq -c --arg name "$name" '.assets[] | select(.name == $name)' <<<"$release_json")
            [[ "$(jq -r .state <<<"$asset")" == "uploaded" ]]
            [[ "$(jq -r .size <<<"$asset")" == "$(stat -c %s "dist/release/$name")" ]]
            # Asset digests are reported by GitHub for recent uploads; when
            # present they must match the local file byte for byte.
            digest=$(jq -r '.digest // empty' <<<"$asset")
            if [[ -n "$digest" ]]; then
              [[ "$digest" == "sha256:$(sha256sum "dist/release/$name" | cut -d' ' -f1)" ]]
            fi
          done < "$RUNNER_TEMP/expected-assets.txt"

          sums_id=$(jq -r '.assets[] | select(.name == "SHA256SUMS.txt") | .id' <<<"$release_json")
          gh api -H 'Accept: application/octet-stream' "repos/${GH_REPO}/releases/assets/${sums_id}" \
            > "$RUNNER_TEMP/remote-SHA256SUMS.txt"
          cmp "$RUNNER_TEMP/remote-SHA256SUMS.txt" dist/release/SHA256SUMS.txt

      # Final step of the final job. Publishing creates the tag at the draft's
      # target (the event sha). The API is addressed by release id: the
      # equivalent of `gh release edit --draft=false`, without any ambiguity
      # between drafts that share a tag name.
      - name: Publish the verified draft
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          if gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            tag_sha=$(gh api "repos/${GH_REPO}/commits/tags/${RELEASE_TAG}" --jq '.sha')
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "::error title=Release tag collision::$RELEASE_TAG appeared at $tag_sha instead of $GITHUB_SHA."
              exit 1
            fi
          fi

          gh api --method PATCH "repos/${GH_REPO}/releases/${RELEASE_ID}" -F draft=false >/dev/null

          release_json=$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}")
          [[ "$(jq -r .draft <<<"$release_json")" == "false" ]]
          tag_sha=$(gh api "repos/${GH_REPO}/commits/tags/${RELEASE_TAG}" --jq '.sha')
          [[ "$tag_sha" == "$GITHUB_SHA" ]]
          {
            echo "### DevBar release published"
            echo "- Release: $(jq -r .html_url <<<"$release_json")"
            echo "- Tag: $RELEASE_TAG"
            echo "- Commit: $GITHUB_SHA"
            echo "- Assets: $(jq -r '[.assets[].name] | join(" ")' <<<"$release_json")"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Remove this run's unpublished release leftovers
    # Runs when a newer push cancels this run or any release job fails.
    # GitHub still runs cancelled() jobs on cancellation, but briefly, so
    # this stays quick and idempotent; the next run's publish job heals
    # whatever this job could not finish. It only ever deletes a DRAFT that
    # this run created (target = this run's sha) and a tag this run created;
    # it never deletes or edits a published release or its tag.
    needs:
      [
        'detect',
        'build-macos',
        'build-windows',
        'build-linux',
        'assemble',
        'publish',
      ]
    if: (cancelled() || failure()) && needs.detect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}
      TAG_AT_HEAD: ${{ needs.detect.outputs.tag_at_head }}
    steps:
      - name: Delete this run's draft release and unpublished tag
        run: |
          set -euo pipefail
          releases=$(gh api --paginate "repos/${GH_REPO}/releases?per_page=100" \
            | jq -s -c --arg tag "$RELEASE_TAG" '[add // [] | .[] | select(.tag_name == $tag) | {id, draft, target_commitish}]')
          if jq -e 'any(.[]; .draft == false)' <<<"$releases" >/dev/null; then
            echo "$RELEASE_TAG is published; nothing is touched."
            exit 0
          fi

          for release_id in $(jq -r --arg sha "$GITHUB_SHA" '.[] | select(.draft and .target_commitish == $sha) | .id' <<<"$releases"); do
            echo "Deleting draft release $release_id for $RELEASE_TAG."
            gh api --method DELETE "repos/${GH_REPO}/releases/${release_id}" >/dev/null \
              || echo "Draft $release_id is already gone."
          done

          # Only a tag this run created: it points to this run's sha and did
          # not already point there when detect ran.
          if [[ "$TAG_AT_HEAD" != "true" ]] \
            && gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            tag_sha=$(gh api "repos/${GH_REPO}/commits/tags/${RELEASE_TAG}" --jq '.sha')
            if [[ "$tag_sha" == "$GITHUB_SHA" ]]; then
              echo "Deleting unpublished tag $RELEASE_TAG at $tag_sha."
              gh api --method DELETE "repos/${GH_REPO}/git/refs/tags/${RELEASE_TAG}" >/dev/null \
                || echo "Tag $RELEASE_TAG is already gone."
            fi
          fi
