name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version from package.json to publish, for example 0.2.0
        required: true
        type: string

permissions: read-all

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Resolve release version
    if: >-
      github.repository == 'juanjoGonDev/devbar' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve version bump or recovery release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          current=$(node -p "require('./package.json').version")
          publish=false

          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            requested=${REQUESTED_VERSION#v}
            if ! printf '%s' "$requested" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo '::error title=Invalid release version::Use a stable semantic version such as 0.2.0.'
              exit 1
            fi
            if [ "$requested" != "$current" ]; then
              echo "::error title=Version mismatch::Requested $requested but package.json contains $current."
              exit 1
            fi
            if gh release view "v$current" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error title=Release already exists::GitHub Release v$current already exists."
              exit 1
            fi
            publish=true
          else
            previous=$(git show HEAD~1:package.json 2>/dev/null \
              | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(data).version));" \
              2>/dev/null || true)
            if [ "$current" != "$previous" ]; then
              publish=true
            fi
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$current" >> "$GITHUB_OUTPUT"
          echo "Resolved release v$current; publish=$publish"

  release:
    name: Build and publish macOS installer
    needs: detect
    if: needs.detect.outputs.publish == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Electron build downloads
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: macos-installer-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build universal DMG and ZIP
        run: pnpm run dist:mac

      - name: Verify release artifacts
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          dmg="DevBar-$VERSION-universal.dmg"
          zip="DevBar-$VERSION-universal.zip"
          test -s "dist/$dmg"
          test -s "dist/$zip"
          (
            cd dist
            shasum -a 256 "$dmg" "$zip" > SHA256SUMS.txt
          )

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error title=Release already exists::GitHub Release v$VERSION already exists."
            exit 1
          fi
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DevBar v$VERSION" \
            --generate-notes \
            "dist/DevBar-$VERSION-universal.dmg" \
            "dist/DevBar-$VERSION-universal.zip" \
            "dist/SHA256SUMS.txt"
