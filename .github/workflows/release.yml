name: Release

on:
  push:
    branches:
      - main
  # No dispatch inputs: any workflow input is a CodeQL taint source, and a
  # tainted ref reaching a checkout/cache step in this default-branch
  # workflow is a cache-poisoning alert. The dispatch path recovers the
  # version currently in package.json on main (detect resolves and verifies
  # the introducing commit against the live tag and release state), so it
  # needs no operator-supplied data.
  workflow_dispatch:

permissions: read-all

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  detect:
    name: Resolve version-introducing commit
    if: >-
      github.repository == 'juanjoGonDev/devbar' &&
      github.event.repository.fork == false &&
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      tag_exists: ${{ steps.release.outputs.tag_exists }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for release policy
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Resolve version change or recovery release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          read_package_version() {
            git show "$1:package.json" 2>/dev/null \
              | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" \
              2>/dev/null || true
          }

          current_version=$(node -p "require('./package.json').version")
          if ! [[ "$current_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=Invalid release version::$current_version is not a stable semantic version."
            exit 1
          fi

          # Recovery (workflow_dispatch) re-resolves the version currently in
          # package.json against the full first-parent history; a push
          # resolves only the version that push introduced.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_range="$GITHUB_SHA"
          else
            zero_sha=0000000000000000000000000000000000000000
            previous_version=
            if [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "$zero_sha" ]]; then
              previous_version=$(read_package_version "$BEFORE_SHA")
            fi
            if [[ -z "$previous_version" || "$previous_version" == "$current_version" ]]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "package.json version did not change on this push."
              exit 0
            fi
            release_range="${BEFORE_SHA}..${GITHUB_SHA}"
          fi

          release_sha=
          while IFS= read -r candidate_sha; do
            candidate_version=$(read_package_version "$candidate_sha")
            if [[ "$candidate_version" != "$current_version" ]]; then
              continue
            fi

            parent_sha=$(git rev-parse "${candidate_sha}^1" 2>/dev/null || true)
            parent_version=
            if [[ -n "$parent_sha" ]]; then
              parent_version=$(read_package_version "$parent_sha")
            fi
            if [[ "$parent_version" != "$current_version" ]]; then
              release_sha="$candidate_sha"
              break
            fi
          done < <(git rev-list --first-parent "$release_range" -- package.json)

          if [[ -z "$release_sha" ]]; then
            echo "::error title=Unresolved release commit::No default-branch commit introduced package version $current_version."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$release_sha" "$GITHUB_SHA"; then
            echo "::error title=Invalid release commit::$release_sha is not an ancestor of $GITHUB_SHA."
            exit 1
          fi

          if [[ "$release_sha" != "$GITHUB_SHA" ]]; then
            echo "::warning title=Release commit is not HEAD::The version-introducing commit $release_sha differs from the push HEAD $GITHUB_SHA; the build uses HEAD."
          fi

          release_tag="v${current_version}"
          expected_assets=(
            "DevBar-${current_version}-macos-arm64.dmg"
            "DevBar-${current_version}-macos-arm64.zip"
            "DevBar-${current_version}-macos-x64.dmg"
            "DevBar-${current_version}-macos-x64.zip"
            "DevBar-${current_version}-win-x64-setup.exe"
            "DevBar-${current_version}-win-x64-portable.exe"
            "DevBar-${current_version}-win-arm64-setup.exe"
            "DevBar-${current_version}-win-arm64-portable.exe"
            "DevBar-${current_version}-linux-x64.AppImage"
            "DevBar-${current_version}-linux-x64.deb"
            "DevBar-${current_version}-linux-arm64.AppImage"
            "DevBar-${current_version}-linux-arm64.deb"
            "DevBar-${current_version}-linux-armv7.AppImage"
            "DevBar-${current_version}-linux-armv7.deb"
            "SHA256SUMS.txt"
          )

          if release_json=$(gh release view "$release_tag" --json tagName,isDraft,isPrerelease,assets 2>/dev/null); then
            if [[ "$(jq -r .isDraft <<<"$release_json")" != "false" || "$(jq -r .isPrerelease <<<"$release_json")" != "false" ]]; then
              echo "::error title=Release metadata mismatch::$release_tag must be a published stable release."
              exit 1
            fi

            git fetch --force origin "refs/tags/${release_tag}:refs/tags/${release_tag}"
            existing_sha=$(git rev-list -n 1 "$release_tag")
            if [[ "$existing_sha" != "$release_sha" ]]; then
              echo "::error title=Release target mismatch::$release_tag points to $existing_sha instead of $release_sha."
              exit 1
            fi

            mapfile -t actual_assets < <(jq -r '.assets[].name' <<<"$release_json" | sort)
            mapfile -t sorted_expected_assets < <(printf '%s\n' "${expected_assets[@]}" | sort)
            if [[ "${actual_assets[*]}" != "${sorted_expected_assets[*]}" ]]; then
              echo "::error title=Release asset mismatch::$release_tag does not contain the exact expected installer set."
              exit 1
            fi

            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Release $release_tag already exists with the expected target and assets."
            exit 0
          fi

          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            latest_release_tag=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
            if [[ -n "$latest_release_tag" ]]; then
              if [[ "$latest_release_tag" == "$release_tag" ]]; then
                echo "::error title=Release state mismatch::$release_tag is listed as the latest stable release but could not be resolved by tag."
                exit 1
              fi
              git fetch --force origin "refs/tags/${latest_release_tag}:refs/tags/${latest_release_tag}"
              latest_release_sha=$(git rev-list -n 1 "$latest_release_tag")
              if ! git merge-base --is-ancestor "$latest_release_sha" "$release_sha"; then
                echo "::error title=Invalid release impact baseline::$latest_release_tag is not an ancestor of $release_sha."
                exit 1
              fi
              impact_json=$(node --experimental-strip-types scripts/release-impact-policy.ts pending "$latest_release_tag" "$release_sha")
              if [[ "$(jq -r .publish <<<"$impact_json")" != "true" ]]; then
                echo "publish=false" >> "$GITHUB_OUTPUT"
                echo "No release-impacting commits exist between $latest_release_tag and $release_sha; installer build skipped."
                exit 0
              fi
            fi
          fi

          tag_exists=false
          if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${release_tag}:refs/tags/${release_tag}"
            existing_sha=$(git rev-list -n 1 "$release_tag")
            if [[ "$existing_sha" != "$release_sha" ]]; then
              echo "::error title=Release tag collision::$release_tag points to $existing_sha instead of $release_sha."
              exit 1
            fi
            tag_exists=true
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$tag_exists" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build & verify macOS installers
    needs: detect
    if: needs.detect.outputs.publish == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      # Plain default-branch checkout (the event sha — an immutable ref).
      # CodeQL treats any checkout whose ref comes from another job's
      # outputs as untrusted code in this cache-writable workflow; in the
      # normal flow the version-introducing commit IS the push HEAD, and
      # detect warns when they differ.
      - name: Checkout release HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: macos-installer-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and verify Intel and Apple Silicon installers
        run: pnpm run release:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-${{ needs.detect.outputs.version }}
          retention-days: 1
          if-no-files-found: error
          path: |
            dist/release/DevBar-${{ needs.detect.outputs.version }}-macos-arm64.dmg
            dist/release/DevBar-${{ needs.detect.outputs.version }}-macos-arm64.zip
            dist/release/DevBar-${{ needs.detect.outputs.version }}-macos-x64.dmg
            dist/release/DevBar-${{ needs.detect.outputs.version }}-macos-x64.zip

  build-windows:
    name: Build & verify Windows installers
    needs: detect
    if: needs.detect.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # Plain default-branch checkout (the event sha — an immutable ref).
      # CodeQL treats any checkout whose ref comes from another job's
      # outputs as untrusted code in this cache-writable workflow; in the
      # normal flow the version-introducing commit IS the push HEAD, and
      # detect warns when they differ.
      - name: Checkout release HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: windows-installer-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and verify NSIS + portable (x64, arm64)
        shell: bash
        run: |
          # electron-builder downloads Electron dists + toolsets (NSIS)
          # from GitHub releases; a transient 5xx must not fail the
          # release — retry before giving up (same wrapper as ci.yml).
          ok=0
          for attempt in 1 2 3; do
            if pnpm run dist; then ok=1; break; fi
            echo "::warning::dist (win) failed on attempt ${attempt} (transient download?) — retrying in 30s"
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          if [ "$ok" != 1 ]; then echo "dist (win) failed after 3 attempts"; exit 1; fi
          pnpm run verify

      - name: Launch smoke — NSIS install + portable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.detect.outputs.version }}'
          Start-Process -Wait -FilePath ".\dist\electron-builder\DevBar-$version-win-x64-setup.exe" -ArgumentList '/S'
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\DevBar\DevBar.exe")) {
            Write-Error "NSIS install did not produce the expected exe"
            exit 1
          }
          # The oneClick installer launches the app at the end of the install;
          # stop that instance so the smoke launch owns the single-instance lock.
          Get-Process DevBar -ErrorAction SilentlyContinue | Stop-Process -Force
          & "$env:LOCALAPPDATA\Programs\DevBar\DevBar.exe" --devbar-smoke *>&1 |
            Tee-Object -FilePath smoke-win-installed.log
          if (-not (Select-String -Path smoke-win-installed.log -Pattern 'DEVBAR_SMOKE_OK' -Quiet)) {
            Write-Error 'installed-app smoke failed'
            exit 1
          }
          # The NSIS portable wrapper runs the real app as a child process
          # without redirecting its stdio, so its DEVBAR_SMOKE_OK line never
          # reaches this console. The app writes a marker file on smoke
          # success (removed at smoke start), and the wrapper only returns
          # once the child exits — so the marker is settled now.
          & ".\dist\electron-builder\DevBar-$version-win-x64-portable.exe" --devbar-smoke *>&1 |
            Out-File -FilePath smoke-win-portable.log -Encoding utf8
          if (-not (Test-Path (Join-Path $env:TEMP 'devbar-smoke-ok'))) {
            Write-Error 'portable-app smoke failed (no smoke marker)'
            exit 1
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-${{ needs.detect.outputs.version }}
          retention-days: 1
          if-no-files-found: error
          path: |
            dist/electron-builder/DevBar-${{ needs.detect.outputs.version }}-win-x64-setup.exe
            dist/electron-builder/DevBar-${{ needs.detect.outputs.version }}-win-x64-portable.exe
            dist/electron-builder/DevBar-${{ needs.detect.outputs.version }}-win-arm64-setup.exe
            dist/electron-builder/DevBar-${{ needs.detect.outputs.version }}-win-arm64-portable.exe

  build-linux:
    name: Build & verify Linux packages (incl. Raspberry Pi)
    needs: detect
    if: needs.detect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # Plain default-branch checkout (the event sha — an immutable ref).
      # CodeQL treats any checkout whose ref comes from another job's
      # outputs as untrusted code in this cache-writable workflow; in the
      # normal flow the version-introducing commit IS the push HEAD, and
      # detect warns when they differ.
      - name: Checkout release HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: linux-installer-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and verify AppImage + deb (x64, arm64, armv7)
        run: |
          # electron-builder downloads Electron dists + toolsets (NSIS,
          # fpm, appimagetool) from GitHub releases; a transient 5xx must
          # not fail the release — retry before giving up (same wrapper
          # as ci.yml).
          ok=0
          for attempt in 1 2 3; do
            if pnpm run dist; then ok=1; break; fi
            echo "::warning::dist (linux) failed on attempt ${attempt} (transient download?) — retrying in 30s"
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          if [ "$ok" != 1 ]; then echo "dist (linux) failed after 3 attempts"; exit 1; fi
          pnpm run verify

      - name: Launch smoke — AppImage + deb (x64, host arch)
        run: |
          set -euo pipefail
          VERSION="${{ needs.detect.outputs.version }}"
          # Hosted runners have no /dev/fuse: extract-and-run executes the
          # same payload a mounted AppImage would (same fix as ci.yml and
          # release-validation.yml).
          xvfb-run -a "dist/electron-builder/DevBar-${VERSION}-linux-x64.AppImage" --appimage-extract-and-run --devbar-smoke 2>&1 | tee smoke-linux-appimage.log
          grep -q DEVBAR_SMOKE_OK smoke-linux-appimage.log
          # .deb: apt resolves the Electron runtime libraries the runner
          # image lacks (plain dpkg -i fails on unmet dependencies).
          sudo apt-get install -y "./dist/electron-builder/DevBar-${VERSION}-linux-x64.deb"
          xvfb-run -a /usr/bin/devbar --devbar-smoke 2>&1 | tee smoke-linux-deb.log
          grep -q DEVBAR_SMOKE_OK smoke-linux-deb.log

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ needs.detect.outputs.version }}
          retention-days: 1
          if-no-files-found: error
          path: |
            dist/electron-builder/DevBar-${{ needs.detect.outputs.version }}-linux-x64.AppImage
            dist/electron-builder/DevBar-${{ needs.detect.outputs.version }}-linux-x64.deb
            dist/electron-builder/DevBar-${{ needs.detect.outputs.version }}-linux-arm64.AppImage
            dist/electron-builder/DevBar-${{ needs.detect.outputs.version }}-linux-arm64.deb
            dist/electron-builder/DevBar-${{ needs.detect.outputs.version }}-linux-armv7.AppImage
            dist/electron-builder/DevBar-${{ needs.detect.outputs.version }}-linux-armv7.deb

  assemble:
    name: Assemble and verify the full release set
    needs: ['detect', 'build-macos', 'build-windows', 'build-linux']
    if: needs.detect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Plain default-branch checkout (the event sha — an immutable ref).
      # CodeQL treats any checkout whose ref comes from another job's
      # outputs as untrusted code in this cache-writable workflow; in the
      # normal flow the version-introducing commit IS the push HEAD, and
      # detect warns when they differ.
      - name: Checkout release HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install and build (for the release tooling)
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Download macOS artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-macos-${{ needs.detect.outputs.version }}
          path: dist/release

      - name: Download Windows artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-windows-${{ needs.detect.outputs.version }}
          path: dist/release

      - name: Download Linux artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-linux-${{ needs.detect.outputs.version }}
          path: dist/release

      - name: Write full SHA256SUMS manifest and verify the complete set
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          node build/scripts/release-manifest.js dist/release "$VERSION"
          node build/scripts/verify-release-artifacts.js dist/release "$VERSION"

      - name: Upload final release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-final-${{ needs.detect.outputs.version }}
          retention-days: 1
          if-no-files-found: error
          path: dist/release

  publish:
    name: Publish release
    # Deliberately no checkout: a privileged job must never check out a ref
    # derived from another job's outputs (CodeQL privileged-checkout rule).
    # Everything this job needs arrives as a verified build artifact, and
    # tag/release operations use the GitHub API instead of local git.
    needs: ['detect', 'assemble']
    if: needs.detect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: admin
    permissions:
      contents: write
    steps:
      - name: Download verified release set
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-final-${{ needs.detect.outputs.version }}
          path: dist/release

      - name: Create immutable release tag
        if: needs.detect.outputs.tag_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.detect.outputs.release_sha }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            existing_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')
            [[ "$existing_sha" == "$RELEASE_SHA" ]]
            exit 0
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" \
            -f sha="$RELEASE_SHA" >/dev/null

      - name: Create or validate GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.detect.outputs.release_sha }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "DevBar $RELEASE_TAG" \
              --generate-notes \
              "dist/release/DevBar-$VERSION-macos-arm64.dmg" \
              "dist/release/DevBar-$VERSION-macos-arm64.zip" \
              "dist/release/DevBar-$VERSION-macos-x64.dmg" \
              "dist/release/DevBar-$VERSION-macos-x64.zip" \
              "dist/release/DevBar-$VERSION-win-x64-setup.exe" \
              "dist/release/DevBar-$VERSION-win-x64-portable.exe" \
              "dist/release/DevBar-$VERSION-win-arm64-setup.exe" \
              "dist/release/DevBar-$VERSION-win-arm64-portable.exe" \
              "dist/release/DevBar-$VERSION-linux-x64.AppImage" \
              "dist/release/DevBar-$VERSION-linux-x64.deb" \
              "dist/release/DevBar-$VERSION-linux-arm64.AppImage" \
              "dist/release/DevBar-$VERSION-linux-arm64.deb" \
              "dist/release/DevBar-$VERSION-linux-armv7.AppImage" \
              "dist/release/DevBar-$VERSION-linux-armv7.deb" \
              "dist/release/SHA256SUMS.txt"
          fi
          # The tag targets the version-introducing commit, but the
          # artifacts are always built from the event HEAD. When the two
          # differ, say which commit the binaries actually came from.
          if [ "$RELEASE_SHA" != "$GITHUB_SHA" ]; then
            body=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --notes "$(printf '%s\n\n---\nBuilt from commit: %s (release tag targets %s, the version-introducing commit).' "$body" "$GITHUB_SHA" "$RELEASE_SHA")"
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.detect.outputs.release_sha }}
        run: |
          set -euo pipefail
          release_json=$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets,url)
          [[ "$(jq -r .tagName <<<"$release_json")" == "$RELEASE_TAG" ]]
          [[ "$(jq -r .isDraft <<<"$release_json")" == "false" ]]
          [[ "$(jq -r .isPrerelease <<<"$release_json")" == "false" ]]

          expected_assets=(
            "DevBar-${VERSION}-macos-arm64.dmg"
            "DevBar-${VERSION}-macos-arm64.zip"
            "DevBar-${VERSION}-macos-x64.dmg"
            "DevBar-${VERSION}-macos-x64.zip"
            "DevBar-${VERSION}-win-x64-setup.exe"
            "DevBar-${VERSION}-win-x64-portable.exe"
            "DevBar-${VERSION}-win-arm64-setup.exe"
            "DevBar-${VERSION}-win-arm64-portable.exe"
            "DevBar-${VERSION}-linux-x64.AppImage"
            "DevBar-${VERSION}-linux-x64.deb"
            "DevBar-${VERSION}-linux-arm64.AppImage"
            "DevBar-${VERSION}-linux-arm64.deb"
            "DevBar-${VERSION}-linux-armv7.AppImage"
            "DevBar-${VERSION}-linux-armv7.deb"
            "SHA256SUMS.txt"
          )
          actual_assets=()
          while IFS= read -r asset; do actual_assets+=("$asset"); done \
            < <(jq -r '.assets[].name' <<<"$release_json" | sort)
          sorted_expected_assets=()
          while IFS= read -r asset; do sorted_expected_assets+=("$asset"); done \
            < <(printf '%s\n' "${expected_assets[@]}" | sort)
          [[ "${actual_assets[*]}" == "${sorted_expected_assets[*]}" ]]

          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')
          [[ "$tag_sha" == "$RELEASE_SHA" ]]

          release_url=$(jq -r .url <<<"$release_json")
          {
            echo "### DevBar release published"
            echo "- Release: $release_url"
            echo "- Tag: $RELEASE_TAG"
            echo "- Commit: $RELEASE_SHA"
            echo "- Assets: ${actual_assets[*]}"
          } >> "$GITHUB_STEP_SUMMARY"
