name: Format release fix once

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - 'scripts/release-artifacts.js'
      - 'tests/release-artifacts.test.js'
      - '.github/workflows/format-release-fix-once.yml'

permissions: read-all

jobs:
  format:
    if: >-
      github.repository == 'juanjoGonDev/devbar' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/fix-release-checksum-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format regression files
        run: pnpm exec prettier --write scripts/release-artifacts.js tests/release-artifacts.test.js

      - name: Upload formatted files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formatted-release-files-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: |
            scripts/release-artifacts.js
            tests/release-artifacts.test.js
