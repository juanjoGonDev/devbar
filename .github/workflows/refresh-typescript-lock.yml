name: Refresh TypeScript migration lockfile

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: refresh-typescript-lock-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  refresh-lock:
    if: >-
      github.repository == 'juanjoGonDev/devbar' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'refactor/typescript-migration' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refactor/typescript-migration
          persist-credentials: true
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Regenerate lockfile reproducibly
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --ignore-scripts
          changed=$(git diff --name-only)
          if [[ "$changed" != 'pnpm-lock.yaml' ]]; then
            echo "::error::Unexpected changed files while regenerating lockfile:"
            printf '%s\n' "$changed"
            exit 1
          fi
          pnpm audit --audit-level=moderate

      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pnpm-lock.yaml
          git diff --cached --check
          git commit -m 'fix(deps): refresh patched nanoid lockfile'
          git push origin HEAD:refactor/typescript-migration
