name: Cleanup TypeScript migration transport

on:
  push:
    branches:
      - refactor/typescript-migration

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Remove migration-only workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-typescript-migration.yml
          git rm .github/workflows/cleanup-typescript-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(typescript): remove migration transport'
          git push origin HEAD:refactor/typescript-migration
