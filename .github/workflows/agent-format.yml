name: Agent format branch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-format-repository-automation
  cancel-in-progress: true

jobs:
  format:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/chore-repository-automation' &&
      github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout task branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/chore-repository-automation
          token: ${{ secrets.REPOSITORY_AUTOMATION_TOKEN || secrets.PAT_FINE || github.token }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Format affected repository files
        run: >-
          pnpm exec prettier --write
          .github/dependabot.yml
          .github/workflows/agent-format.yml
          .github/workflows/auto-merge-required-qa.workflow.yml
          .github/workflows/auto-release.workflow.yml
          .github/workflows/delete-cache.workflow.yml
          README.md

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/dependabot.yml \
            .github/workflows/agent-format.yml \
            .github/workflows/auto-merge-required-qa.workflow.yml \
            .github/workflows/auto-release.workflow.yml \
            .github/workflows/delete-cache.workflow.yml \
            README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format repository automation"
          git push origin HEAD:agent/chore-repository-automation
