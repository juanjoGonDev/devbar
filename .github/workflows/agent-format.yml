name: Agent format branch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions: read-all

concurrency:
  group: agent-format-repository-automation
  cancel-in-progress: true

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/chore-repository-automation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout task branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/chore-repository-automation
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Format affected repository files
        run: >-
          pnpm exec prettier --write
          .github/dependabot.yml
          .github/workflows/agent-format.yml
          .github/workflows/auto-merge-required-qa.workflow.yml
          .github/workflows/auto-release.workflow.yml
          .github/workflows/delete-cache.workflow.yml
          README.md

      - name: Collect formatted files
        run: |
          mkdir -p formatted/.github/workflows
          cp .github/dependabot.yml formatted/.github/dependabot.yml
          cp .github/workflows/agent-format.yml formatted/.github/workflows/agent-format.yml
          cp .github/workflows/auto-merge-required-qa.workflow.yml formatted/.github/workflows/auto-merge-required-qa.workflow.yml
          cp .github/workflows/auto-release.workflow.yml formatted/.github/workflows/auto-release.workflow.yml
          cp .github/workflows/delete-cache.workflow.yml formatted/.github/workflows/delete-cache.workflow.yml
          cp README.md formatted/README.md

      - name: Upload formatted files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formatted-repository-automation
          path: formatted
          if-no-files-found: error
          retention-days: 1
