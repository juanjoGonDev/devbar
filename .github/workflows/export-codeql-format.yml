name: Export CodeQL formatting

on:
  push:
    branches: [release/v0.2.0]

permissions: read-all

concurrency:
  group: export-codeql-format
  cancel-in-progress: false

jobs:
  export:
    if: github.repository == 'juanjoGonDev/devbar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: release/v0.2.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install formatter
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Export formatted workflow
        run: |
          pnpm exec prettier --write .github/workflows/codeql.yml
          pnpm exec prettier --check .github/workflows/codeql.yml
          mkdir -p .agents/tmp
          cp .github/workflows/codeql.yml .agents/tmp/codeql-formatted.yml.txt
          git checkout -- .github/workflows/codeql.yml
          git diff --check

      - name: Commit formatting evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agents/tmp/codeql-formatted.yml.txt
          if git diff --cached --quiet; then
            echo 'Formatting evidence already current'
            exit 0
          fi
          git commit -m 'chore(actions): export codeql formatting evidence'
          git push origin HEAD:release/v0.2.0
